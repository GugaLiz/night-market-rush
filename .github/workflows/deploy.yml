name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test Pages package safeguards
        run: python3 -m unittest discover -s tests -p test_cocos_pages.py
      - name: Check Cocos package matches source
        run: python3 scripts/cocos_pages.py verify
      - name: Build previous Web version
        run: npm run build
      - name: Assemble Cocos and legacy Pages site
        run: python3 scripts/cocos_pages.py assemble --out .runtime/pages-site --legacy dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .runtime/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
