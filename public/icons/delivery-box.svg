<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">夜市急送外卖箱</title>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2=".35" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#72d2ab"/>
      <stop offset="1" stop-color="#258570"/>
    </linearGradient>
